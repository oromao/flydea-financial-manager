name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# E2E requires a real database. This job is skipped if secrets are unavailable.
jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Skip if no database credentials (e.g., fork PRs)
    if: ${{ secrets.DATABASE_URL != '' }}

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3010

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed database
        run: npx prisma db push --force-reset && npx prisma db seed
        continue-on-error: true

      - name: Start dev server
        run: npm run dev &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3010 | grep -q "200\|307\|401"; then
              echo "Server ready"
              exit 0
            fi
            echo "Waiting for server... ($i)"
            sleep 2
          done
          echo "Server did not start in 60s"
          exit 1

      - name: Run E2E tests
        run: npx playwright test tests/consistency.spec.ts
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
