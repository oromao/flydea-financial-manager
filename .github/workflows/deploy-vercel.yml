name: Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔐 Configure Vercel Environment Variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "🔐 Configurando variáveis de ambiente..."

          # Instalar Vercel CLI
          npm install -g vercel@latest

          # Configurar DATABASE_URL
          vercel env add DATABASE_URL "postgresql://neondb_owner:npg_LhFS0qK7rkaZ@ep-lucky-truth-antd5lhh-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require" --token=$VERCEL_TOKEN --yes || true

          # Configurar DIRECT_URL
          vercel env add DIRECT_URL "postgresql://neondb_owner:npg_LhFS0qK7rkaZ@ep-lucky-truth-antd5lhh-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require" --token=$VERCEL_TOKEN --yes || true

          # Configurar NEXTAUTH_URL
          vercel env add NEXTAUTH_URL "https://flydea-financial-manager.vercel.app" --token=$VERCEL_TOKEN --yes || true

          # Gerar e configurar NEXTAUTH_SECRET
          NEXTAUTH_SECRET=$(openssl rand -base64 32)
          vercel env add NEXTAUTH_SECRET "$NEXTAUTH_SECRET" --token=$VERCEL_TOKEN --yes || true

          echo "✅ Variáveis configuradas!"

      - name: 🚀 Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prod --token=$VERCEL_TOKEN

      - name: ✅ Deploy Completo!
        run: |
          echo "✅ Deploy finalizado!"
          echo "🌐 Acesse: https://flydea-financial-manager.vercel.app"
